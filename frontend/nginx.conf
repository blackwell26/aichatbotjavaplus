server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Performance: Enable gzip compression (T10.3) ──────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";
    gzip_min_length 256;

    # ── Performance: Enable brotli compression if available ───────────────────
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # ── Performance: Connection optimizations ─────────────────────────────────
    keepalive_timeout 65;
    keepalive_requests 100;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # ── Performance: Client body buffer ───────────────────────────────────────
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # ── Performance: Timeouts ─────────────────────────────────────────────────
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;

    # ── Security headers (Phase 9 / WEB-SEC-003…006) ──────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # T9.3 / WEB-SEC-006 — Content Security Policy
    # style-src allows 'unsafe-inline' for Angular Material dynamic styles.
    # connect-src permits the API gateway, local backend, and WebSocket endpoints.
    # font-src / style-src cover Google Fonts + Material Icons used by the SPA.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https: http://localhost:8080 http://127.0.0.1:8080 http://192.168.1.87:8080 wss: ws:; upgrade-insecure-requests" always;

    # ── Static assets: long-lived cache (content-hashed filenames) ────────────
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|webp|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ── index.html: never cache (always re-fetch on navigation) ───────────────
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https: http://localhost:8080 http://127.0.0.1:8080 http://192.168.1.87:8080 wss: ws:; upgrade-insecure-requests" always;
    }

    # ── Health endpoint for Kubernetes/container liveness checks ──────────────
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # ── Angular router: serve index.html for all unknown paths ────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Disable server tokens ─────────────────────────────────────────────────
    server_tokens off;
}
