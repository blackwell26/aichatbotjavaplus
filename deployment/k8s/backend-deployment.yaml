apiVersion: apps/v1
kind: Deployment
metadata:
  name: aichatbot-backend
  namespace: aichatbot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aichatbot-backend
  template:
    metadata:
      labels:
        app: aichatbot-backend
    spec:
      containers:
        - name: backend
          image: aichatbot/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: aichatbot-config
            - secretRef:
                name: aichatbot-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
