apiVersion: apps/v1
kind: Deployment
metadata:
  name: aichatbot-frontend
  namespace: aichatbot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aichatbot-frontend
  template:
    metadata:
      labels:
        app: aichatbot-frontend
    spec:
      containers:
        - name: frontend
          image: aichatbot/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
