apiVersion: v1
kind: Service
metadata:
  name: aichatbot-frontend
  namespace: aichatbot
  labels:
    app: aichatbot-frontend
    component: frontend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  selector:
    app: aichatbot-frontend
    component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800