apiVersion: v1
kind: ConfigMap
metadata:
  name: aichatbot-config
  namespace: aichatbot
data:
  SPRING_PROFILES_ACTIVE: prod
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aichatbot
  SPRING_DATA_MONGODB_URI: mongodb://admin:admin@mongo:27017/aichatbot?authSource=admin
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
  SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL: llama3.1
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
  FEATURE_RAG: "true"
  FEATURE_INTENT_CLASSIFICATION: "true"
  FEATURE_RECOMMENDATIONS: "true"
  FEATURE_SENTIMENT_ANALYSIS: "false"
  FEATURE_AUTO_ESCALATION: "false"
  FEATURE_MULTILINGUAL: "false"
  FEATURE_KB_AUTO_INDEX: "true"
